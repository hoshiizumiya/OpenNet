name: Canary

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish prerelease
        required: false
        default: true
        type: boolean
  push:
    branches-ignore:
      - l10n_develop
      - release
      - dependabot/**
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'
  pull_request:
      branches-ignore:
      - l10n_develop
      - release
      - dependabot/**
      paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'

permissions:
  contents: write
  packages: write

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

env:
  USERNAME: hoshiizumiya
  FEED_URL: https://nuget.pkg.github.com/hoshiizumiya/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/hoshiizumiya/index.json,readwrite"

jobs:
  build:
    runs-on: windows-2025-vs2026
    outputs:
      date: ${{ steps.meta.outputs.date }}
      package_name: ${{ steps.meta.outputs.package_name }}

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      
      - name: Install MSVC Preview Build Tools
        shell: cmd
        run: |
          echo Installing MSVC Preview Build Tools...
      
          start "" /wait "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify ^
            --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" ^
            --add Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64 ^
            --add Microsoft.VisualStudio.Component.VC.Preview.ARM64 ^
            --quiet ^
            --norestart
      
          set EXIT_CODE=%ERRORLEVEL%
      
          echo Visual Studio Installer exit code: %EXIT_CODE%
      
          if not "%EXIT_CODE%"=="0" (
            echo Visual Studio Installer failed.
            exit /b %EXIT_CODE%
          )

      - name: Verify MSVC Preview Build Tools
        shell: pwsh
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
      
          $previewVersionFile = Join-Path `
            $vsPath `
            "VC\Auxiliary\Build\Microsoft.VCToolsVersion.Preview.txt"
      
          Write-Host "Checking:"
          Write-Host $previewVersionFile
      
          if (-not (Test-Path $previewVersionFile)) {
            Write-Host "Contents of VC\Auxiliary\Build:"
            Get-ChildItem "$vsPath\VC\Auxiliary\Build" |
              Select-Object Name, LastWriteTime
      
            throw "MSVC Preview toolset was not installed."
          }
      
          $previewVersion = (Get-Content $previewVersionFile).Trim()
      
          Write-Host "MSVC Preview version: $previewVersion"
      
          $toolsetPath = Join-Path `
            $vsPath `
            "VC\Tools\MSVC\$previewVersion"
      
          if (-not (Test-Path $toolsetPath)) {
            throw "MSVC Preview directory does not exist: $toolsetPath"
          }
      
          Write-Host "MSVC Preview toolset found:"
          Write-Host $toolsetPath

      - name: Set up vcpkg
        working-directory: ${{ env.VCPKG_INSTALLATION_ROOT }}
        shell: pwsh
        run: vcpkg integrate install

      - name: Add NuGet sources for vcpkg
        shell: pwsh
        run: |
          $nuget = & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" fetch nuget
          
          & $nuget sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"

          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "${{ env.FEED_URL }}"

      - name: Set up vcpkg dependencies
        shell: pwsh
        run: |
          $triplet = if ('${{ matrix.platform }}' -eq 'ARM64') {
            'arm64-windows-custom'
          } else {
            'x64-windows-custom'
          }

          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            --triplet $triplet `
            --vcpkg-root "$env:VCPKG_INSTALLATION_ROOT" `
            --x-manifest-root "$env:GITHUB_WORKSPACE\OpenNet" `
            --x-install-root "$env:GITHUB_WORKSPACE\OpenNet\vcpkg_installed\$triplet"

      - name: Restore NuGet
        shell: pwsh
        run: nuget restore OpenNet.slnx

      - name: Restore Certificate
        run: |
          $certPath = "$env:GITHUB_WORKSPACE\cert.pfx"
          $bytes = [Convert]::FromBase64String("${{ secrets.PFX_CERT_BASE64 }}")
          [IO.File]::WriteAllBytes($certPath, $bytes)

          if (-not (Test-Path $certPath)) {
            throw "Certificate file not found: $certPath"
          }

          Write-Host "Certificate restored to:"
          Write-Host $certPath
        working-directory: ${{ github.workspace }}
        shell: pwsh

      - name: Import Certificate
        id: import_cert
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $certPath = "$env:GITHUB_WORKSPACE\cert.pfx"

          $password = ConvertTo-SecureString `
            "${{ secrets.PFX_PASSWORD }}" `
            -AsPlainText `
            -Force

          $cert = Import-PfxCertificate `
            -FilePath $certPath `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password

          if (-not $cert) {
            throw "Import-PfxCertificate failed."
          }

          $thumb = $cert.Thumbprint
          Write-Host "Certificate imported."
          Write-Host "Thumbprint: $thumb"

          echo "thumbprint=$thumb" >> $env:GITHUB_OUTPUT

      - name: Show Installed Certificates
        shell: pwsh
        run: |
          Get-ChildItem Cert:\CurrentUser\My |
            Select Subject, Thumbprint

      - name: Generate package metadata
        id: meta
        shell: pwsh
        run: |
          $dateYear = Get-Date -Format yyyy
          $dateMonth = (Get-Date).Month
          $dateDay = (Get-Date).Day
          $date = Get-Date -Format yyyyMMdd
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $name = "OpenNet.Canary_${date}_${{ matrix.platform }}_${shortSha}"
          $revision = ${{ github.run_number }} % 65536
          $version = "$dateYear.$dateMonth.$dateDay.$revision"
          "date=$date" >> $env:GITHUB_OUTPUT
          "package_name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          msbuild OpenNet\OpenNet.vcxproj `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir=AppPackages\ `
            /p:AppxPackageVersion=${{ steps.meta.outputs.version }} `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ steps.import_cert.outputs.thumbprint }}" `
            /p:PackageCertificateKeyFile= `
            /p:PackageCertificatePassword= `
            /m:1

      - name: Cleanup certificate
        if: always()
        shell: pwsh
        run: |
          $thumb = "${{ steps.import_cert.outputs.thumbprint }}"
          if ($thumb) {
            Get-ChildItem Cert:\CurrentUser\My |
              Where-Object Thumbprint -eq $thumb |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          Remove-Item "$env:GITHUB_WORKSPACE\cert.pfx" -Force -ErrorAction SilentlyContinue

      - name: Copy SideloadReadme
        shell: pwsh
        run: Copy-Item SideloadReadme.md OpenNet\AppPackages\SideloadReadme.md -Force

      - name: Pack 7z
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y
          }

          $archive = "${{ steps.meta.outputs.package_name }}.7z"
          7z a -t7z -mx=9 $archive "OpenNet\AppPackages\*"
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Move-Item $archive out\

      - name: Upload Canary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.package_name }}
          path: out\*.7z
          if-no-files-found: error
          retention-days: 14
          
  prerelease:
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: out

      - name: Publish or update prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: canary-latest
          name: Canary Latest
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: out/**/*.7z
          generateReleaseNotes: true
          body: |
            Auto-updated canary package.
            Date: ${{ needs.build.outputs.date }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            Trigger: ${{ github.event_name }}
            Actor: ${{ github.actor }}

  cleanup-cache:
    needs: prerelease
    runs-on: ubuntu-latest
  
    permissions:
      packages: write
  
    steps:
      - name: Delete old NuGet package versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: hoshiizumiya
        shell: bash
        run: |
          set -e
  
          echo "Listing NuGet packages..."
  
          gh api \
            "/users/$OWNER/packages?package_type=nuget&per_page=100" \
            --paginate \
            > packages.json
  
          jq -c '.[]' packages.json | while read pkg; do
  
            PACKAGE_NAME=$(echo "$pkg" | jq -r '.name')
  
            echo "Processing $PACKAGE_NAME"
  
            gh api \
              "/users/$OWNER/packages/nuget/$PACKAGE_NAME/versions?per_page=100" \
              --paginate \
              > versions.json
  
            COUNT=$(jq length versions.json)
  
            if [ "$COUNT" -le 1 ]; then
              echo "Only one version exists."
              continue
            fi
  
            jq '
              sort_by(.created_at)
              | reverse
              | .[1:]
            ' versions.json > delete.json
  
            jq -c '.[]' delete.json | while read version; do
  
              ID=$(echo "$version" | jq -r '.id')
  
              echo "Deleting version $ID"
  
              gh api \
                --method DELETE \
                "/users/$OWNER/packages/nuget/$PACKAGE_NAME/versions/$ID"
  
            done
  
          done